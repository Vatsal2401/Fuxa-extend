<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="TracloT logo">
  <!-- TracloT — chip silhouette with bold WHITE "T" inside.
       The previous dark-navy T blended into the same-colored dark
       header background. White T against brand-blue chip body
       reads instantly at any size (favicon 16px → splash 120px). -->
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4c9fff"/>
      <stop offset="100%" stop-color="#1ed5ff"/>
    </linearGradient>
  </defs>
  <!-- Chip body — full bleed rounded square -->
  <rect x="6" y="6" width="88" height="88" rx="18" ry="18" fill="url(#tg)"/>
  <!-- The "T" — WHITE strokes, chunky -->
  <rect x="22" y="28" width="56" height="12" rx="3" fill="#ffffff"/>
  <rect x="44" y="28" width="12" height="48" rx="3" fill="#ffffff"/>
</svg>
