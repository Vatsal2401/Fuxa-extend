<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="TracloT logo">
  <!-- TracloT — clean chip/T mark, optimised to read at small sizes
       (favicon 16-32px + header 32px). Removed pin marks + circuit
       traces — at small sizes they collapsed to noise. The mark is
       now a chunky rounded chip with a big confident T inside. -->
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#4c9fff"/>
      <stop offset="100%" stop-color="#1ed5ff"/>
    </linearGradient>
  </defs>
  <!-- Chip body — full bleed rounded square so the silhouette stays
       obvious even at favicon sizes. -->
  <rect x="6" y="6" width="88" height="88" rx="18" ry="18" fill="url(#tg)"/>
  <!-- "T" mark — negative-space cut from the chip face. Dark colour
       picks up the design-system surface (--ds-bg #08111f). -->
  <rect x="22" y="28" width="56" height="12" rx="3" fill="#08111f"/>
  <rect x="44" y="28" width="12" height="48" rx="3" fill="#08111f"/>
</svg>
