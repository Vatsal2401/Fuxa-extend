<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <!-- Background (Optional: change to transparent if needed) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(25, 25)">
    <!-- Top Pins -->
    <g fill="#11161a">
      <path d="M 170,60 L 170,35 C 170,30 173,25 177.5,25 C 182,25 185,30 185,35 L 185,60 Z" />
      <path d="M 210,60 L 210,35 C 210,30 213,25 217.5,25 C 222,25 225,30 225,35 L 225,60 Z" />
      <path d="M 250,60 L 250,35 C 250,30 253,25 257.5,25 C 262,25 265,30 265,35 L 265,60 Z" />
      <path d="M 290,60 L 290,35 C 290,30 293,25 297.5,25 C 302,25 305,30 305,35 L 305,60 Z" />
    </g>

    <!-- Bottom Pins -->
    <g fill="#0a5c5a">
      <path d="M 150,300 L 150,325 C 150,330 147,335 142.5,335 C 138,335 135,330 135,325 L 135,300 Z" />
      <path d="M 190,300 L 190,325 C 190,330 187,335 182.5,335 C 178,335 175,330 175,325 L 175,300 Z" />
      <path d="M 230,300 L 230,325 C 230,330 227,335 222.5,335 C 218,335 215,330 215,325 L 215,300 Z" />
      <path d="M 270,300 L 270,325 C 270,330 267,335 262.5,335 C 258,335 255,330 255,325 L 255,300 Z" />
      <path d="M 310,300 L 310,325 C 310,330 307,335 302.5,335 C 298,335 295,330 295,325 L 295,300 Z" />
    </g>

    <!-- Main Chip Body -->
    <rect x="100" y="60" width="270" height="240" rx="45" ry="45" fill="#008080" />
    <rect x="115" y="75" width="240" height="210" rx="35" ry="35" fill="none" stroke="#ffffff" stroke-width="8" />

    <!-- Letter 'T' -->
    <path d="M 180,110 L 290,110 L 290,150 L 253,150 L 253,250 L 217,250 L 217,150 L 180,150 Z" fill="#ffffff" />

    <!-- Right Side Circuit Lines -->
    <g stroke="#11161a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Line 1 (Top) -->
      <path d="M 370,115 L 435,115" />
      <circle cx="435" cy="115" r="7" fill="#11161a" stroke="none" />

      <!-- Line 2 -->
      <path d="M 370,155 L 415,155 L 435,175 L 455,175" />
      <circle cx="455" cy="175" r="7" fill="#11161a" stroke="none" />

      <!-- Line 3 -->
      <path d="M 370,200 L 445,200" />
      <circle cx="445" cy="200" r="7" fill="#11161a" stroke="none" />

      <!-- Line 4 (Bottom Switch-like line) -->
      <path d="M 370,240 L 400,240 L 415,225 M 420,240 L 435,260 L 450,260" />
      <circle cx="450" cy="260" r="7" fill="#11161a" stroke="none" />
    </g>
  </g>
</svg>
